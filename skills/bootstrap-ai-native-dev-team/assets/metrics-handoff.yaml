metrics_handoff:
  task_id: <TASK-ID>
  actor: <AGENT_OR_THREAD>
  actual_model: <RUNTIME_CONFIRMED_MODEL_OR_UNKNOWN>
  capability_tier: <ECONOMY_OR_STANDARD_OR_ADVANCED_OR_FRONTIER_OR_MAIN_AGENT>
  reasoning_tier: <LOW_OR_MEDIUM_OR_HIGH_OR_MAX_OR_CURRENT>
  owned_paths:
    - <PATH>
  events:
    - event: <WORKER_STARTED_OR_DEV_COMPLETE_OR_QA_COMPLETE>
      timestamp: <ISO_8601>
      commit: <FULL_COMMIT_SHA_OR_NA>
      result: <PASSED_OR_FAILED_OR_BLOCKED_OR_NA>
      active_minutes: <NON_NEGATIVE_NUMBER>
      governance_minutes: <NON_NEGATIVE_NUMBER>
  confirmed_facts:
    - <FACT>
  inferences:
    - <INFERENCE>
  to_verify:
    - <ITEM>
  known_limits:
    - <LIMIT>
