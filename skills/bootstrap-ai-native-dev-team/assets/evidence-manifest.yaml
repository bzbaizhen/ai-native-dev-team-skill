evidence:
  task: <TASK-ID>
  repository: <REPOSITORY>
  stable_branch: <STABLE_BRANCH>
  baseline_commit: <FULL_COMMIT_SHA>
  candidate_commit: <FULL_COMMIT_SHA>
  stable_commit: <FULL_COMMIT_SHA>
  environment: <OS_AND_RUNTIME>
  environment_fingerprint: <FINGERPRINT>
  contract_version: <VERSION_OR_NA>
  linear_isolation:
    # Linear issue UUID/id:
    issue_uuid: <UUID_OR_NA>
    issue_id: <LINEAR_ID_OR_NA>
    # Linear gitBranchName:
    git_branch_name: <EXACT_BRANCH_OR_NA>
    # Canonical worktree:
    canonical_worktree: <NATIVE_ABSOLUTE_PATH_OR_NA>
    # Base ref / full base Commit:
    base_ref: <REF_OR_NA>
    base_commit: <FULL_COMMIT_OR_NA>
    # Initial/current HEAD:
    initial_head: <FULL_COMMIT_OR_NA>
    current_head: <FULL_COMMIT_OR_NA>
    # Working-tree continuation state:
    working_tree_continuation: <CLEAN_DIRTY_OR_NA>
    # Writer cwd / allowed root:
    writer_cwd: <NATIVE_ABSOLUTE_PATH_OR_NA>
    allowed_root: <NATIVE_ABSOLUTE_PATH_OR_NA>
    # Worktree ownership:
    ownership: <WRITER_OR_NA>
    # Linear checkpoint readback:
    checkpoint_readback: <PATH_OR_URL_OR_NA>
    # Exact tested HEAD:
    exact_tested_head: <FULL_COMMIT_OR_NA>
  tests:
    - command: <EXACT_COMMAND>
      result: <PASSED_OR_FAILED>
      evidence_path: <PATH_OR_URL>
      tested_commit: <FULL_COMMIT_SHA>
  manual_validation:
    type: <NONE_OR_STATIC_OR_SIMULATOR_OR_TARGET_PLATFORM_OR_REAL_ENVIRONMENT>
    result: <RESULT>
  qa:
    reviewer: <THREAD_OR_AGENT>
    independent: <TRUE_OR_FALSE>
    result: <PASSED_OR_FAILED_OR_BLOCKED>
    reviewed_commit: <FULL_COMMIT_SHA>
  acceptance:
    accepted_by: <MAIN_AGENT>
    stable_commit_matches_candidate: <TRUE_OR_FALSE>
    status_truth_match: <TRUE_OR_FALSE>
    owner_approval: <TRUE_OR_FALSE_OR_NA>
  known_limits:
    - <LIMIT>
  rollback: <EXECUTABLE_METHOD>
  recovery_evidence: <PATH_URL_OR_NA>
  timestamp: <ISO_8601>
